name: Release

# 推送 V* 形式的 tag 时，自动构建 Windows / macOS 便携包并发布到对应 Release。
# 构建脚本自带校验：固定 SHA-256 的嵌入版 Python、白名单文件树、逐文件清单与校验和。
on:
  push:
    tags:
      - "V*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and publish portable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # 构建脚本会下载固定 SHA-256 的 Windows 嵌入版 Python、macOS 双架构便携
      # Python 运行时与全部目标平台 wheel。非对应平台上运行时 smoke check 自动
      # 跳过真实执行，只做布局与 Mach-O 架构校验，因此 Linux runner 可以完整
      # 产出三个包。
      - name: Build Windows and macOS packages
        run: python -m scripts.build_release

      - name: Verify built artifacts
        run: |
          set -euo pipefail
          test -f dist/MathBank-Windows-x64.zip
          test -f dist/MathBank-macOS-AppleSilicon.zip
          test -f dist/MathBank-macOS-Intel.zip
          # 2.2.0 的单架构 macOS 包名已废弃，构建失败时不得回落到旧产物。
          test ! -f dist/MathBank-macOS.zip
          ls -lh dist/MathBank-*.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/MathBank-Windows-x64.zip \
              dist/MathBank-macOS-AppleSilicon.zip \
              dist/MathBank-macOS-Intel.zip --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file .github/release-notes.md \
              dist/MathBank-Windows-x64.zip \
              dist/MathBank-macOS-AppleSilicon.zip \
              dist/MathBank-macOS-Intel.zip
          fi
