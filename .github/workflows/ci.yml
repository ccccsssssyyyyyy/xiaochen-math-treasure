name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / tests and static JS
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      # 部分用例会真实调用 xelatex 编译 PDF（试卷 bundle 导出）。装上最小 TeX 工具链，
      # 让这些用例在 CI 上真跑；缺工具链时端点会走优雅降级分支，测试同样有断言覆盖。
      - name: Install minimal TeX Live
        run: |
          sudo apt-get update -qq
          # texlive-plain-generic 提供 ulem.sty：xeCJKfntef.sty 会 require 它，
          # 缺了会让所有真实编译的用例直接报 "File `ulem.sty' not found" 而失败。
          # 它不在 texlive-lang-chinese 的 apt 依赖链里，必须显式装（2026-09-19 踩）。
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-science texlive-pictures \
            texlive-plain-generic
          xelatex --version | head -1
          for sty in exam-zh.cls ulem.sty; do
            if kpsewhich "$sty" >/dev/null; then
              echo "$sty 可用"
            else
              echo "::warning::$sty 未随 apt 包提供，相关用例可能失败或走降级分支"
            fi
          done
      - name: Run test suite
        run: python -m pytest tests/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse browser JavaScript
        shell: bash
        run: |
          for script in static/js/*.js; do
            node --check "$script"
          done

  release-guards:
    name: Release guards / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install guard-test runner
        run: python -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Run Release and launcher guard tests without app conftest
        run: python -m pytest --noconftest tests/test_release_hardening.py
      - name: Parse macOS launcher
        if: runner.os == 'macOS'
        shell: bash
        run: bash -n '启动题库系统.command'
